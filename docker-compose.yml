# Copy `.env.example` → `.env` on the server and fill secrets (file is gitignored).
# One file can drive API + web: JWT_SECRET, Stripe keys, public URLs.
#
# NextAuth uses NEXTAUTH_SECRET; if you omit it, web falls back to JWT_SECRET so you can use one value.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bharatathlete
      POSTGRES_PASSWORD: bharatathlete
      POSTGRES_DB: bharatathlete
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatathlete"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://bharatathlete:bharatathlete@postgres:5432/bharatathlete
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_TOURNAMENT_PASS: ${STRIPE_PRICE_ID_TOURNAMENT_PASS:-}
      STRIPE_PRICE_ID_ANNUAL_PRO: ${STRIPE_PRICE_ID_ANNUAL_PRO:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      # Browser + server fetch to API (use your public API URL in production)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Same as API by default so one secret in .env is enough; override with NEXTAUTH_SECRET if you want
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${JWT_SECRET:-change-me-in-production}}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      - api
      - postgres

volumes:
  pgdata: {}
  redisdata: {}
