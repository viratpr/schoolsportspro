<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="American school sports complex background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3a"/>
      <stop offset="55%" stop-color="#1f3f73"/>
      <stop offset="100%" stop-color="#f3b56a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b14b2f"/>
      <stop offset="100%" stop-color="#9a3f26"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7a44"/>
      <stop offset="100%" stop-color="#245f35"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.86" cy="0.22" r="0.42">
      <stop offset="0%" stop-color="#ffd89a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd89a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Distant school buildings -->
  <g opacity="0.35" fill="#11284d">
    <rect x="980" y="260" width="180" height="120"/>
    <rect x="1160" y="240" width="140" height="140"/>
    <rect x="1305" y="270" width="160" height="110"/>
    <rect x="1470" y="250" width="90" height="130"/>
  </g>

  <!-- Scoreboard -->
  <g transform="translate(1220 285)">
    <rect x="0" y="0" width="230" height="130" rx="8" fill="#101826" opacity="0.9"/>
    <rect x="12" y="12" width="206" height="52" rx="4" fill="#1e2f4f"/>
    <rect x="12" y="72" width="206" height="46" rx="4" fill="#1a2740"/>
    <g fill="#a4d9ff" opacity="0.8">
      <rect x="24" y="24" width="84" height="8"/>
      <rect x="24" y="38" width="110" height="8"/>
      <rect x="138" y="24" width="24" height="22"/>
      <rect x="172" y="24" width="24" height="22"/>
      <rect x="24" y="84" width="58" height="7"/>
      <rect x="24" y="97" width="76" height="7"/>
      <rect x="138" y="82" width="58" height="20"/>
    </g>
  </g>

  <!-- Running track -->
  <path d="M0 900 L1600 900 L1600 710 C1300 660 940 640 580 652 C360 660 180 692 0 748 Z" fill="url(#track)"/>
  <g stroke="#eec7ad" stroke-width="3" opacity="0.48" fill="none">
    <path d="M0 770 C170 712 360 680 580 672 C940 658 1290 684 1600 736"/>
    <path d="M0 792 C170 734 360 702 580 694 C940 680 1290 706 1600 758"/>
    <path d="M0 814 C170 756 360 724 580 716 C940 702 1290 728 1600 780"/>
  </g>

  <!-- Football/soccer field -->
  <path d="M130 700 C320 650 540 620 790 610 C1040 600 1240 620 1410 654 L1475 704 L1320 742 C1160 770 980 785 760 790 C530 795 350 780 190 748 L120 724 Z" fill="url(#field)"/>

  <!-- Yard lines -->
  <g stroke="#d8f6df" stroke-width="2" opacity="0.35">
    <line x1="300" y1="735" x2="315" y2="666"/>
    <line x1="420" y1="756" x2="434" y2="650"/>
    <line x1="540" y1="772" x2="553" y2="639"/>
    <line x1="665" y1="781" x2="675" y2="632"/>
    <line x1="790" y1="785" x2="798" y2="629"/>
    <line x1="915" y1="782" x2="921" y2="632"/>
    <line x1="1038" y1="773" x2="1044" y2="641"/>
    <line x1="1160" y1="758" x2="1166" y2="656"/>
    <line x1="1280" y1="739" x2="1288" y2="678"/>
  </g>

  <!-- Soccer goal -->
  <g stroke="#dfeaf2" stroke-width="4" opacity="0.72" fill="none">
    <rect x="1050" y="620" width="150" height="64"/>
    <line x1="1050" y1="620" x2="1080" y2="590"/>
    <line x1="1200" y1="620" x2="1230" y2="590"/>
    <line x1="1080" y1="590" x2="1230" y2="590"/>
  </g>

  <!-- Baseball diamond -->
  <g opacity="0.55">
    <polygon points="1310,650 1360,620 1410,650 1360,680" fill="#c9aa8a"/>
    <circle cx="1360" cy="650" r="10" fill="#e9d8bf"/>
  </g>

  <!-- Athlete silhouettes -->
  <g fill="#0d1424" opacity="0.72">
    <!-- Runner -->
    <circle cx="1000" cy="640" r="14"/>
    <path d="M988 656 L1013 656 L1017 694 L997 694 Z"/>
    <path d="M1002 693 L979 735 L996 740 L1014 704 Z"/>
    <path d="M1013 693 L1042 730 L1058 723 L1028 688 Z"/>
    <path d="M992 662 L968 688 L980 700 L1002 676 Z"/>
    <path d="M1010 662 L1036 678 L1046 663 L1018 649 Z"/>

    <!-- Basketball player -->
    <circle cx="1125" cy="612" r="13"/>
    <path d="M1113 626 L1135 626 L1138 662 L1116 662 Z"/>
    <path d="M1120 662 L1103 710 L1118 716 L1132 668 Z"/>
    <path d="M1133 662 L1152 709 L1168 704 L1144 660 Z"/>
    <path d="M1118 632 L1092 648 L1100 662 L1124 648 Z"/>
    <circle cx="1080" cy="650" r="11" fill="#d77a3a"/>

    <!-- Football player -->
    <circle cx="1238" cy="602" r="14"/>
    <path d="M1226 616 L1252 616 L1257 658 L1229 658 Z"/>
    <path d="M1234 658 L1219 710 L1236 714 L1248 662 Z"/>
    <path d="M1248 658 L1269 705 L1285 698 L1260 656 Z"/>
    <ellipse cx="1272" cy="642" rx="13" ry="8" fill="#8f5c3a"/>
  </g>

  <!-- Left-side negative space overlay for UI readability -->
  <rect x="0" y="0" width="700" height="900" fill="#0b1630" opacity="0.18"/>
  <rect x="0" y="0" width="520" height="900" fill="#081125" opacity="0.16" filter="url(#soft)"/>
</svg>
