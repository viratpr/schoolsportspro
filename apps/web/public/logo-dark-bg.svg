<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" aria-hidden="true">
  <title>SchoolSports Pro</title>
  <defs>
    <style>
      .ssp-wm {
        font-family: system-ui, -apple-system, 'Segoe UI', Helvetica Neue, Arial, sans-serif;
      }
    </style>
  </defs>

  <!--
    ICON  — same Track-S monogram, scaled to 75%.
    On dark backgrounds the S stroke shifts to a lighter blue tint (#60A5FA)
    so it stays visible, orange accent remains unchanged.
  -->
  <g transform="scale(0.75)">
    <!-- S-track spine (lighter blue for dark bg) -->
    <path
      d="M 50,14
         C 50,6  14,6  14,22
         C 14,31 48,33 48,46
         C 48,56 14,58 14,52"
      fill="none"
      stroke="#60A5FA"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Orange speed chevron (unchanged) -->
    <path
      d="M 41,10 L 54,21 L 41,32"
      fill="none"
      stroke="#F97316"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lane-marker dots -->
    <circle cx="50" cy="14" r="3.5" fill="#60A5FA"/>
    <circle cx="14" cy="52" r="3.5" fill="#F97316"/>
  </g>

  <!--
    WORDMARK — white text on dark backgrounds, orange "Pro" accent.
  -->
  <text
    x="54" y="30"
    class="ssp-wm"
    font-size="20"
    font-weight="700"
    fill="#FFFFFF"
  >SchoolSports<tspan fill="#F97316" font-weight="800" dx="2">Pro</tspan></text>

  <!-- Category tag line -->
  <text
    x="55" y="42"
    class="ssp-wm"
    font-size="8.5"
    font-weight="500"
    fill="#94A3B8"
    letter-spacing="1.8"
  >SPORTS MANAGEMENT PLATFORM</text>
</svg>
