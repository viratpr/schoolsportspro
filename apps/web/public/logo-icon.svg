<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <title>SchoolSports Pro</title>
  <!--
    Track-S monogram
    The S is drawn as a single continuous cubic-bezier path evoking an
    athletics S-bend / double-lane track.  An orange forward chevron sits at
    the upper-right as the speed / performance accent.
  -->

  <!-- S-track spine -->
  <path
    d="M 50,14
       C 50,6  14,6  14,22
       C 14,31 48,33 48,46
       C 48,56 14,58 14,52"
    fill="none"
    stroke="#1E40AF"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Orange speed chevron (forward motion mark) -->
  <path
    d="M 41,10 L 54,21 L 41,32"
    fill="none"
    stroke="#F97316"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lane-marker dots: start (blue) and finish (orange) -->
  <circle cx="50" cy="14" r="3.5" fill="#1E40AF"/>
  <circle cx="14" cy="52" r="3.5" fill="#F97316"/>
</svg>
